version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: rbac_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: role_based_admin
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - rbac_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend (PHP-FPM)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbac_backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rbac_network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: role_based_admin
      DB_USERNAME: laravel
      DB_PASSWORD: secret

  # Nginx for Laravel
  nginx:
    image: nginx:alpine
    container_name: rbac_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - rbac_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api
    container_name: rbac_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    networks:
      - rbac_network
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api

networks:
  rbac_network:
    driver: bridge

volumes:
  mysql_data:
